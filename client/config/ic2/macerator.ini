; -----------------------------------------------------------------------------
; GAMNINA 2000 - APPLIED ENERGISTICS 2
; -----------------------------------------------------------------------------

; Quartz-family crystals. Charged Certus intentionally loses its charge.
OreDict:crystalCertusQuartz = appliedenergistics2:material@2
appliedenergistics2:material@1 = appliedenergistics2:material@2
OreDict:gemQuartz = appliedenergistics2:material@3
OreDict:crystalFluix = appliedenergistics2:material@8

; AE2 ores: deterministic IC2-style doubling.
OreDict:oreCertusQuartz = appliedenergistics2:material@2*2

; AE2 storage and decorative blocks.
appliedenergistics2:quartz_block = appliedenergistics2:material@0*4
appliedenergistics2:chiseled_quartz_block = appliedenergistics2:material@0*4
appliedenergistics2:quartz_pillar = appliedenergistics2:material@0*4
appliedenergistics2:fluix_block = appliedenergistics2:material@7*4

; AE2 stairs and slabs return the material actually contained in them.
appliedenergistics2:quartz_stairs = appliedenergistics2:material@0*6
appliedenergistics2:chiseled_quartz_stairs = appliedenergistics2:material@0*6
appliedenergistics2:quartz_pillar_stairs = appliedenergistics2:material@0*6
appliedenergistics2:fluix_stairs = appliedenergistics2:material@7*6
appliedenergistics2:quartz_slab = appliedenergistics2:material@0*2
appliedenergistics2:chiseled_quartz_slab = appliedenergistics2:material@0*2
appliedenergistics2:quartz_pillar_slab = appliedenergistics2:material@0*2
appliedenergistics2:fluix_slab = appliedenergistics2:material@7*2

; Sky Stone family.
appliedenergistics2:sky_stone_block = appliedenergistics2:material@45
appliedenergistics2:smooth_sky_stone_block = appliedenergistics2:material@45
appliedenergistics2:sky_stone_brick = appliedenergistics2:material@45
appliedenergistics2:sky_stone_small_brick = appliedenergistics2:material@45

; Ender Pearl processing used by AE2 quantum recipes.
minecraft:ender_pearl = appliedenergistics2:material@46

; -----------------------------------------------------------------------------
; GAMNINA 2000 - MISSING VANILLA PROCESSING
; -----------------------------------------------------------------------------

; Gem and redstone ores omitted by stock IC2's table.
minecraft:coal_ore = minecraft:coal*2
minecraft:redstone_ore = minecraft:redstone*8
minecraft:lapis_ore = minecraft:dye@4*12
minecraft:diamond_ore = minecraft:diamond*2
minecraft:emerald_ore = minecraft:emerald*2
minecraft:quartz_ore = appliedenergistics2:material@3*2

; Lossless block recycling where the original ingredients are unambiguous.
minecraft:glass = minecraft:sand
minecraft:hardened_clay@* = ic2:dust#clay*8
minecraft:brick = ic2:dust#clay*2
minecraft:brick_block = ic2:dust#clay*8
minecraft:bone_block = minecraft:dye@15*9
minecraft:snow = minecraft:snowball*4
minecraft:packed_ice = minecraft:ice*9
minecraft:hay_block = minecraft:wheat*9
minecraft:slime = minecraft:slime_ball*9
minecraft:magma = minecraft:magma_cream*4
minecraft:nether_wart_block = minecraft:nether_wart*9

; Sensible lossy recycling for processed building blocks.
minecraft:stonebrick@* = minecraft:cobblestone
minecraft:prismarine@* = minecraft:prismarine_shard*4
minecraft:sea_lantern = minecraft:prismarine_crystals*5

; -----------------------------------------------------------------------------
; GAMNINA 2000 - THAUMCRAFT AND PROJECTRED
