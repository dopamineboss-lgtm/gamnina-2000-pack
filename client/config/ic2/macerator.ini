; Thaumcraft ores and storage blocks.
thaumcraft:ore_amber = thaumcraft:amber*2
thaumcraft:amber_block = thaumcraft:amber*9
thaumcraft:ore_cinnabar = thaumcraft:quicksilver*2
thaumcraft:ore_quartz = appliedenergistics2:material@3*2

; ProjectRed exploration gems and Electrotine.
OreDict:oreRuby = projectred-core:resource_item@200*2
OreDict:oreSapphire = projectred-core:resource_item@201*2
OreDict:orePeridot = projectred-core:resource_item@202*2
OreDict:oreElectrotine = projectred-core:resource_item@105*12
