; Gamnina 2000 - IC2 Macerator recipes
; Based on the complete IC2 2.8.170 default table, with safe cross-mod additions.
; Keep this file on BOTH the client and dedicated server.
;
; Syntax:
;   <input> = <output 1>[, <output n>...]
;   item names may use @metadata and *amount
;   IC2 variants use the item#variant form
;
; -----------------------------------------------------------------------------
; IC2 DEFAULT RECIPES
; -----------------------------------------------------------------------------

