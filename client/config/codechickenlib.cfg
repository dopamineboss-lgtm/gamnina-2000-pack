"client" {
	# Catch broken third-party item renderers instead of terminating Minecraft.
	B:"catchItemRenderExceptions"=true

	# IC2 fluid cells can throw from MergedItemModel while JEI rapidly changes pages.
	# CCL restores the vanilla BufferBuilder and skips only that broken render.
	B:"attemptRecoveryOnItemRenderException"=true

	B:"catchBlockRenderExceptions"=true
	B:"messagePlayerOnRenderCrashCaught"=true
}
