# Configuration file

List {
    # OreDictionary names that should not be unified. Supports regex.
    S:blacklist <
        .*Wood
        .*Glass.*
        stair.*
        fence.*
        plank.*
        slab.*
        .*Marble.*
     >

    # 0 = whitelist, 1 = blacklist, 2 = both, 3 = no lists.
    I:listMode=2

    # OreDictionary material forms that should become their UniDict canonical item.
    S:whitelist <
        block.*
        chunk.*
        dust.*
        dustSmall.*
        dustTiny.*
        gear.*
        gem.*
        ingot.*
        nugget.*
        ore.*
        plate.*
        rod.*
     >
}

general {
    S:alternatives <
        aluminum aluminium bauxite
     >

    S:blacklistMods <
        chisel
        astralsorcery
     >

    # UniDict decides the canonical owner; in this pack IC2 wins for copper and tin.
    S:preferredMods <
        ic2
        projectred-exploration
        minecraft
     >

    B:useUnidict=true
}

unifyEvent {
    B:death=true
    B:drop=true
    B:gui=true
    B:harvest=true
    # Safety pass: also normalize player inventories every second.
    B:second=true
}
